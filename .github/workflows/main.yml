name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      pages: write
      id-token: write
